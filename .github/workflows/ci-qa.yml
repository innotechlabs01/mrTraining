name: CI - QA

on:
  push:
    branches: [QA]
  pull_request:
    branches: [QA]

jobs:
  go-api:
    name: Go API (QA)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - name: Verify and sync Supabase / Postgres migrations
        run: bash ../../scripts/sync-migrations.sh --ci
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - run: go mod download
      - run: go mod tidy
      - run: git diff --exit-code go.mod go.sum
      - name: Compile Go API
        run: go build ./...
      - name: Run Go Unit Tests
        env:
          APP_ENV: development
        run: go test -p 1 ./internal/... -race -count=1

  web:
    name: Web (QA)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test --if-present

  mobile:
    name: Mobile typecheck (QA)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run typecheck
