name: CD - Mobile Android QA (EAS Build + Firebase App Distribution)

on:
  push:
    branches: [qa]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/cd-mobile-qa.yml'
  workflow_dispatch:
    inputs:
      tester_groups:
        description: 'Firebase App Distribution tester groups (comma-separated)'
        required: false
        default: 'qa-testers'
      release_notes:
        description: 'Release notes for testers'
        required: false
        default: 'QA build from GitHub Actions'

concurrency:
  group: cd-mobile-qa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  android-qa-distribute:
    name: Build Android QA APK with EAS & Distribute to Firebase
    runs-on: ubuntu-latest
    env:
      HAS_FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEPLOY != '' }}
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install EAS CLI
        run: npm install --global eas-cli

      - name: Read app version from app.json
        id: version
        run: |
          VERSION_NAME=$(node -e "console.log(require('./app.json').expo.version || '')")
          VERSION_CODE=$(node -e "console.log(require('./app.json').expo.android?.versionCode || process.env.GITHUB_RUN_NUMBER || '1')")
          if [ -z "$VERSION_CODE" ] || [ -z "$VERSION_NAME" ]; then
            echo "❌ No se pudo leer version/versionCode de app.json"
            exit 1
          fi
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "📦 Versión QA: $VERSION_NAME (code $VERSION_CODE)"

      - name: Get commit author
        id: author
        run: |
          AUTHOR=$(git log -1 --format='%an <%ae>')
          echo "author=$AUTHOR" >> $GITHUB_OUTPUT

      - name: Write QA google-services.json
        env:
          FIREBASE_GOOGLE_SERVICES_JSON_QA: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_QA }}
        run: |
          if [ -z "$FIREBASE_GOOGLE_SERVICES_JSON_QA" ]; then
            echo "❌ Missing secret FIREBASE_GOOGLE_SERVICES_JSON_QA"
            exit 1
          fi
          printf '%s' "$FIREBASE_GOOGLE_SERVICES_JSON_QA" > google-services.qa.json

      - name: Configure Expo authentication
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "❌ Missing secret EXPO_TOKEN"
            echo "   Generalo con: eas-cli login (luego eas-cli whoami para ver el token)"
            exit 1
          fi
          # Escribir token en el archivo de credenciales de Expo para que eas-cli lo use
          mkdir -p ~/.expo
          echo "{\"accessToken\":\"$EXPO_TOKEN\"}" > ~/.expo/credentials.json
          echo "✅ Expo autenticado"
          npx eas-cli whoami

      - name: Get Expo project ID
        id: project
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          # Intentar leer projectId de .expo/eas.json (creado por eas init)
          PROJECT_ID=""
          if [ -f ".expo/eas.json" ]; then
            PROJECT_ID=$(node -e "try{console.log(require('./.expo/eas.json').projectId)}catch{e}process.exit(1)")
          fi
          if [ -z "$PROJECT_ID" ]; then
            echo "❌ No se encontro projectId en .expo/eas.json"
            echo "   Ejecuta 'npx eas-cli init' en apps/mobile/ y commitea .expo/eas.json"
            exit 1
          fi
          echo "project_id=$PROJECT_ID" >> $GITHUB_OUTPUT
          echo "📋 Proyecto EAS: $PROJECT_ID"

      - name: Install Mobile dependencies
        run: npm ci

      - name: Build Android QA APK with EAS
        id: build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          BUILD_OUTPUT=$(npx eas-cli build --platform android --profile qa --non-interactive 2>&1)
          echo "$BUILD_OUTPUT"
          BUILD_ID=$(echo "$BUILD_OUTPUT" | grep -oE '[a-f0-9-]{36}' | head -1)
          if [ -z "$BUILD_ID" ]; then
            echo "❌ No se pudo obtener el build ID de EAS"
            exit 1
          fi
          echo "build_id=$BUILD_ID" >> $GITHUB_OUTPUT
          echo "🆔 Build ID: $BUILD_ID"

      - name: Wait for EAS build to complete
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          PROJECT_ID: ${{ steps.project.outputs.project_id }}
          BUILD_ID: ${{ steps.build.outputs.build_id }}
        run: |
          for i in $(seq 1 60); do
            STATUS=$(curl -s -H "Authorization: Bearer $EXPO_TOKEN" \
              "https://api.expo.dev/v2/projects/$PROJECT_ID/builds/$BUILD_ID" \
              | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{console.log(JSON.parse(d).status)}catch{e{console.log('UNKNOWN')}}})")
            echo "⏳ Estado del build ($i/60): $STATUS"
            if [ "$STATUS" = "finished" ]; then
              echo "✅ Build terminado"
              exit 0
            elif [ "$STATUS" = "errored" ] || [ "$STATUS" = "failed" ]; then
              echo "❌ Build falló"
              exit 1
            elif [ "$STATUS" = "canceled" ]; then
              echo "❌ Build cancelado"
              exit 1
            fi
            sleep 30
          done
          echo "❌ Timeout esperando el build de EAS"
          exit 1

      - name: Download APK artifact from EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          PROJECT_ID: ${{ steps.project.outputs.project_id }}
          BUILD_ID: ${{ steps.build.outputs.build_id }}
        run: |
          ARTIFACT_URL=$(curl -s -H "Authorization: Bearer $EXPO_TOKEN" \
            "https://api.expo.dev/v2/projects/$PROJECT_ID/builds/$BUILD_ID" \
            | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{const j=JSON.parse(d);console.log(j.artifacts?.appArchiveUrl || j.artifacts?.ipaUrl || '')}catch{e{process.exit(1)}}})")
          if [ -z "$ARTIFACT_URL" ]; then
            echo "❌ No se pudo obtener la URL del artifact de EAS"
            exit 1
          fi
          echo "⬇️  Descargando APK desde EAS..."
          curl -L -H "Authorization: Bearer $EXPO_TOKEN" -o app-qa-release.apk "$ARTIFACT_URL"
          if [ ! -f app-qa-release.apk ] || [ ! -s app-qa-release.apk ]; then
            echo "❌ El APK descargado esta vacio o no existe"
            exit 1
          fi
          echo "✅ APK descargado: $(wc -c < app-qa-release.apk) bytes"
          echo "APP_APK_PATH=$PWD/app-qa-release.apk" >> $GITHUB_ENV

      - name: Distribute to Firebase App Distribution
        if: env.HAS_FIREBASE_SA == 'true'
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: '1:399408860598:android:9dc9797d89afbb9cd10517'
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEPLOY }}
          groups: ${{ github.event.inputs.tester_groups || 'qa-testers' }}
          releaseNotes: |
            QA Build v${{ env.VERSION_NAME }} (code ${{ env.VERSION_CODE }})
            Commit: ${{ github.sha }}
            Autor: ${{ steps.author.outputs.author }}
            ${{ github.event.inputs.release_notes && format('Notas: {0}', github.event.inputs.release_notes) || '' }}
          file: ${{ env.APP_APK_PATH }}
