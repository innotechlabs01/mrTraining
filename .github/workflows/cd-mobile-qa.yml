name: CD - Mobile Android QA (EAS Build + Firebase App Distribution)

on:
  push:
    branches: [qa]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/cd-mobile-qa.yml'
  workflow_dispatch:
    inputs:
      tester_groups:
        description: 'Firebase App Distribution tester groups (comma-separated)'
        required: false
        default: 'qa-testers'
      release_notes:
        description: 'Release notes for testers'
        required: false
        default: 'QA build from GitHub Actions'

concurrency:
  group: cd-mobile-qa-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  android-qa-distribute:
    name: Build Android QA APK with EAS & Distribute to Firebase
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      HAS_FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEPLOY != '' }}
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate EXPO_TOKEN
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Falta el secret EXPO_TOKEN (expo.dev -> Account settings -> Access tokens)"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test -- --watchAll=false

      - name: Read app version
        id: version
        run: |
          echo "version_name=$(node -p "require('./app.json').expo.version")" >> "$GITHUB_OUTPUT"

      - name: Get commit author
        id: author
        run: echo "author=$(git log -1 --format='%an <%ae>')" >> "$GITHUB_OUTPUT"

      - name: Build Android APK with EAS
        id: build
        run: |
          set -euo pipefail
          # stdout (JSON) va al archivo; stderr (logs) queda visible en la consola
          eas build \
            --platform android \
            --profile qa \
            --non-interactive \
            --wait \
            --json > build.json

          BUILD_ID=$(node -p "const j=require('./build.json'); (Array.isArray(j)?j[0]:j).id")
          STATUS=$(node -p "const j=require('./build.json'); (Array.isArray(j)?j[0]:j).status")
          APK_URL=$(node -p "const j=require('./build.json'); const b=Array.isArray(j)?j[0]:j; (b.artifacts&&(b.artifacts.buildUrl||b.artifacts.applicationArchiveUrl))||''")

          echo "### EAS build: https://expo.dev/accounts/innotechlabssass-team/projects/mr-training/builds/$BUILD_ID (estado: $STATUS)" >> "$GITHUB_STEP_SUMMARY"

          if [ "$STATUS" != "FINISHED" ]; then
            echo "::error::El build de EAS terminó con estado $STATUS"
            exit 1
          fi
          if [ -z "$APK_URL" ]; then
            echo "::error::EAS no devolvió la URL del artefacto"
            exit 1
          fi

          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          echo "apk_url=$APK_URL" >> "$GITHUB_OUTPUT"

      - name: Download APK
        env:
          APK_URL: ${{ steps.build.outputs.apk_url }}
        run: |
          curl -fL -o app-qa-release.apk "$APK_URL"
          test -s app-qa-release.apk
          echo "APK: $(wc -c < app-qa-release.apk) bytes"
          echo "APP_APK_PATH=$PWD/app-qa-release.apk" >> "$GITHUB_ENV"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-qa-release
          path: apps/mobile/app-qa-release.apk
          retention-days: 14

      - name: Distribute to Firebase App Distribution
        if: env.HAS_FIREBASE_SA == 'true'
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: '1:399408860598:android:9dc9797d89afbb9cd10517'
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEPLOY }}
          groups: ${{ github.event.inputs.tester_groups || 'qa-testers' }}
          file: ${{ env.APP_APK_PATH }}
          releaseNotes: |
            QA Build v${{ steps.version.outputs.version_name }}
            Commit: ${{ github.sha }}
            Autor: ${{ steps.author.outputs.author }}
            ${{ github.event.inputs.release_notes }}