# CD - QA API a Cloud Run con secretos de Secret Manager (poblados desde Infisical).
#
# Disparo: push a `qa` o pull_request hacia `qa`.
#
# Flujo:
#   1. Autenticar a GCP vía Workload Identity Federation (OIDC).
#   2. Leer secretos de Infisical (ruta /api, entorno qa) con INFISICAL_TOKEN.
#   3. Poblar Google Secret Manager (proyecto mr-training-backend) con sufijo _QA.
#   4. Build + push imagen de la API a Artifact Registry.
#   5. Desplegar Cloud Run `mr-training-backend` con --set-secrets.
#   6. Imprimir URL del servicio (para agregarla a Innotech-secrets).
#
# Seguridad:
#   - Sin clave de servicio de larga vida en GitHub Secrets (WIF).
#   - Los secretos viajan de Infisical → Secret Manager → Cloud Run, nunca en Git.
#   - La Service Account de Cloud Run requiere roles/secretmanager.secretAccessor.
#
# GitHub Secrets requeridos:
#   - INFISICAL_URL           → https://secrets.innotechlabssas.lat
#   - INFISICAL_TOKEN         → token de máquina de Infisical
#   - GCP_PROJECT_ID          → mr-training-backend
#   - GCP_WORKLOAD_IDENTITY_PROVIDER
#   - GCP_CLOUD_RUN_SA
#   - CORS_ORIGINS_QA         → lista de orígenes permitidos (texto, no secreto)
#   - GCP_ARTIFACT_REGISTRY   → us-central1-docker.pkg.dev (o el registry del proyecto)

name: CD - QA API a Cloud Run (Secret Manager)

on:
  push:
    branches: [qa]
  pull_request:
    branches: [qa]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_REGION: us-central1
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REPOSITORY: mr-training
  SERVICE: mr-training-backend
  IMAGE: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/api
  INFISICAL_PROJECT_ID: 7218cfde-d9ad-4722-8ffa-9009b1cc40a8
  INFISICAL_ENV: qa
  INFISICAL_PATH: /api

jobs:
  deploy:
    name: Desplegar API QA en Cloud Run
    runs-on: ubuntu-latest
    environment: qa
    steps:
      - uses: actions/checkout@v4

      - id: auth
        name: Autenticar con GCP (Workload Identity Federation / OIDC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_CLOUD_RUN_SA }}

      - name: Instalar Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configurar Docker para Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev

      - name: Instalar herramientas (jq + Infisical CLI)
        run: |
          apt-get update -y && apt-get install -y jq
          curl -fsSL https://github.com/infisical/infisical-cli/releases/latest/download/infisical-linux-amd64.tar.gz \
            | tar -xz -C /usr/local/bin
          infisical --version

      - name: Poblar Secret Manager desde Infisical (ruta /api, entorno qa)
        env:
          INFISICAL_TOKEN: ${{ secrets.INFISICAL_TOKEN }}
          INFISICAL_URL: ${{ secrets.INFISICAL_URL }}
        run: |
          infisical login --method=token --token="$INFISICAL_TOKEN" >/dev/null 2>&1 || true

          SECRETS_JSON=$(infisical secrets \
            --env="${{ env.INFISICAL_ENV }}" \
            --path="${{ env.INFISICAL_PATH }}" \
            --projectId="${{ env.INFISICAL_PROJECT_ID }}" \
            --url="${INFISICAL_URL}" \
            --format=json)

          echo "$SECRETS_JSON" | jq -r 'to_entries[] | "\(.key) \(.value)"' | while read -r key value; do
            secret_name="${key}_QA"
            printf '%s' "$value" | gcloud secrets create "$secret_name" \
              --replication-policy="automatic" \
              --data-file=- 2>/dev/null \
              || printf '%s' "$value" | gcloud secrets versions add "$secret_name" --data-file=-
            echo "✅ $secret_name poblado en Secret Manager"
          done

      - name: Construir y push imagen de la API
        working-directory: apps/api
        run: |
          TAG="${{ github.sha }}"
          docker build -t "${{ env.IMAGE }}:${TAG}" .
          docker push "${{ env.IMAGE }}:${TAG}"
          echo "IMAGE=${{ env.IMAGE }}:${TAG}" >> "$GITHUB_ENV"

      - name: Desplegar Cloud Run con secretos de Secret Manager
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --image "$IMAGE" \
            --region "${{ env.GCP_REGION }}" \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --set-env-vars="APP_ENV=qa,APP_PORT=8080,LOG_LEVEL=info,CORS_ORIGINS=${{ secrets.CORS_ORIGINS_QA }}" \
            --set-secrets="DATABASE_URL=DATABASE_URL_QA:latest,CLERK_SECRET_KEY=CLERK_SECRET_KEY_QA:latest,CLERK_PUBLISHABLE_KEY=CLERK_PUBLISHABLE_KEY_QA:latest,CLERK_WEBHOOK_SECRET=CLERK_WEBHOOK_SECRET_QA:latest,WOMPI_PRIVATE_KEY=WOMPI_PRIVATE_KEY_QA:latest,WOMPI_INTEGRITY_SECRET=WOMPI_INTEGRITY_SECRET_QA:latest,WOMPI_EVENTS_SECRET=WOMPI_EVENTS_SECRET_QA:latest,WOMPI_PUBLIC_KEY=WOMPI_PUBLIC_KEY_QA:latest,WOMPI_ENV=WOMPI_ENV_QA:latest,WOMPI_WEBHOOK_URL=WOMPI_WEBHOOK_URL_QA:latest,APP_URL=APP_URL_QA:latest,WEB_APP_URL=WEB_APP_URL_QA:latest,ERROR_WEBHOOK_DISCOR=ERROR_WEBHOOK_DISCOR_QA:latest,PLATFORM_SUPER_ADMIN_CLERK_ID=PLATFORM_SUPER_ADMIN_CLERK_ID_QA:latest,NATS_URL=NATS_URL_QA:latest,REDIS_URL=REDIS_URL_QA:latest" \
            --min-instances=1 \
            --max-instances=5 \
            --cpu=1 \
            --memory=512Mi

      - name: Smoke test /health y mostrar URL
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE }} --region "${{ env.GCP_REGION }}" --format='value(status.url)')
          echo "🚀 Cloud Run QA URL: $URL"
          curl -fsS --max-time 60 "$URL/health"
          echo "URL_CLOUD_RUN=$URL" >> "$GITHUB_ENV"

      - name: Anotar URL para Innotech-secrets
        run: |
          echo "Agrega esta URL a Innotech-secrets (ruta /api, entorno qa): ${{ env.URL_CLOUD_RUN }}"
