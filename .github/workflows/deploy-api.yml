# Deploy Go API to Render
# Se dispara solo cuando cambia apps/api/**.
# Render autoDeploy=false: el servicio solo se re-builda cuando este workflow lo invoca.
name: Deploy API to Render

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          curl -sf -X POST \
            -H "Content-Type: application/json" \
            -d "{\"commitSha\":\"${COMMIT_SHA}\"}" \
            "${RENDER_DEPLOY_HOOK_URL}"
      - name: Announce deploy
        run: echo "Deploy triggered for ${COMMIT_SHA}"