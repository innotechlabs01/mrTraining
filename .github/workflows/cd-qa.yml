name: CD - QA (Cloud Run)

on:
  push:
    branches: [qa]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_REGION: us-central1
  REPOSITORY: mr-training
  SERVICE: mr-training-api-qa

jobs:
  deploy:
    name: Deploy API to Cloud Run (QA)
    runs-on: ubuntu-latest
    environment: qa
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: apps/api/go.sum

      - name: Compute deploy coordinates
        run: |
          PROJECT_ID="${{ secrets.GCP_PROJECT_ID }}"
          if [ -z "$PROJECT_ID" ]; then
            echo "❌ Secret GCP_PROJECT_ID is not configured" >&2
            exit 1
          fi
          IMAGE="${{ env.GCP_REGION }}-docker.pkg.dev/${PROJECT_ID}/${{ env.REPOSITORY }}/api:${{ github.sha }}"
          echo "PROJECT_ID=${PROJECT_ID}" >> "$GITHUB_ENV"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"

      # --- Migraciones PostgreSQL QA (Supabase) ------------------------
      - name: Run QA PostgreSQL migrations
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_QA }}
          APP_DB_PASSWORD: ${{ secrets.APP_DB_PASSWORD_QA }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "⚠️  DATABASE_URL no configurado, saltando migraciones QA"
            exit 0
          fi
          if [[ "$DATABASE_URL" == *"@db."*".supabase.co"* ]]; then
            echo "❌ DATABASE_URL_QA apunta al host directo IPv6-only (db.*.supabase.co), que falla en GitHub Actions y Cloud Run." >&2
            echo "   Actualiza el secret DATABASE_URL_QA al IPv4 Session Pooler:" >&2
            echo "   postgresql://postgres.<PROJECT_REF>:<PASSWORD>@aws-0-us-east-2.pooler.supabase.com:5432/postgres?sslmode=require" >&2
            exit 1
          fi
          bash ../../scripts/sync-migrations.sh --ci
          ../../scripts/ensure-app-role.sh
          go run ./cmd/migrate -dir migrations/postgres

      # --- WIF: autenticación sin claves JSON -------------------------
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER_QA }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT_QA }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          export_default_credentials: true

      - name: Verify Application Default Credentials
        run: gcloud auth application-default print-access-token > /dev/null && echo "✅ ADC configurado correctamente"

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev

      # --- Build y push de imagen inmutable (SHA del commit) ----------
      - name: Build and push API image
        working-directory: apps/api
        run: |
          docker build -t "${IMAGE}" .
          docker push "${IMAGE}"

      # --- Despliegue a Cloud Run QA -----------------------------------
      # Usa Google Secret Manager (--set-secrets) con el SA cloud-run-api + Infisical remoto (https://secrets.innotechlabssas.lat).
      - name: Deploy Cloud Run service
        env:
          CLERK_JWKS_URL_QA: ${{ secrets.CLERK_JWKS_URL_QA }}
          WEB_APP_URL_QA: ${{ secrets.WEB_APP_URL_QA }}
          INFISICAL_BASE_URL_QA: ${{ secrets.INFISICAL_BASE_URL_QA }}
          INFISICAL_CLIENT_ID_QA: ${{ secrets.INFISICAL_CLIENT_ID_QA }}
          INFISICAL_CLIENT_SECRET_QA: ${{ secrets.INFISICAL_CLIENT_SECRET_QA }}
          INFISICAL_PROJECT_ID_QA: ${{ secrets.INFISICAL_PROJECT_ID_QA }}
        run: |
          INFISICAL_URL="${INFISICAL_BASE_URL_QA:-https://secrets.innotechlabssas.lat}"
          INFISICAL_URL="${INFISICAL_URL%/}"
          INFISICAL_ON="false"
          if [ -n "$INFISICAL_URL" ] && [ -n "$INFISICAL_CLIENT_ID_QA" ] && [ -n "$INFISICAL_CLIENT_SECRET_QA" ] && [ -n "$INFISICAL_PROJECT_ID_QA" ]; then
            case "$INFISICAL_URL" in
              http://localhost*|https://localhost*|http://127.0.0.1*|https://127.0.0.1*)
                echo "⚠️  INFISICAL_BASE_URL_QA apunta a localhost; se usa https://secrets.innotechlabssas.lat."
                INFISICAL_URL="https://secrets.innotechlabssas.lat"
                ;;
            esac
            if curl -sf --max-time 5 "${INFISICAL_URL}/api/status" >/dev/null 2>&1; then
              echo "✅ Infisical remoto (${INFISICAL_URL}) disponible."
              INFISICAL_ON="true"
            else
              echo "⚠️  Infisical remoto (${INFISICAL_URL}) no responde (ej. 502 / túnel cerrado); Cloud Run usará directamente Google Secret Manager (--set-secrets)."
              INFISICAL_ON="false"
            fi
          fi

          ENV_VARS="APP_ENV=qa,APP_PORT=8080,LOG_LEVEL=info,WOMPI_ENV=sandbox"
          ENV_VARS="${ENV_VARS},INFISICAL_ENABLED=${INFISICAL_ON}"
          ENV_VARS="${ENV_VARS},INFISICAL_ENVIRONMENT=qa"
          ENV_VARS="${ENV_VARS},INFISICAL_SECRET_PATH=/api"
          if [ "$INFISICAL_ON" = "true" ]; then
            ENV_VARS="${ENV_VARS},INFISICAL_BASE_URL=${INFISICAL_URL}"
            ENV_VARS="${ENV_VARS},INFISICAL_CLIENT_ID=${INFISICAL_CLIENT_ID_QA}"
            ENV_VARS="${ENV_VARS},INFISICAL_CLIENT_SECRET=${INFISICAL_CLIENT_SECRET_QA}"
            ENV_VARS="${ENV_VARS},INFISICAL_PROJECT_ID=${INFISICAL_PROJECT_ID_QA}"
          fi
          if [ -n "$CLERK_JWKS_URL_QA" ]; then ENV_VARS="${ENV_VARS},CLERK_JWKS_URL=${CLERK_JWKS_URL_QA}"; fi
          if [ -n "$WEB_APP_URL_QA" ]; then
            case "$WEB_APP_URL_QA" in
              http://*|https://*) ENV_VARS="${ENV_VARS},WEB_APP_URL=${WEB_APP_URL_QA}" ;;
              *) ENV_VARS="${ENV_VARS},WEB_APP_URL=https://${WEB_APP_URL_QA}" ;;
            esac
          fi

          SECRETS="DATABASE_URL=DATABASE_URL_QA:latest"
          SECRETS="${SECRETS},CLERK_PUBLISHABLE_KEY=CLERK_PUBLISHABLE_KEY_QA:latest"
          SECRETS="${SECRETS},CLERK_SECRET_KEY=CLERK_SECRET_KEY_QA:latest"
          SECRETS="${SECRETS},CLERK_WEBHOOK_SECRET=CLERK_WEBHOOK_SECRET_QA:latest"
          SECRETS="${SECRETS},WOMPI_PRIVATE_KEY=WOMPI_PRIVATE_KEY_QA:latest"
          SECRETS="${SECRETS},WOMPI_INTEGRITY_SECRET=WOMPI_INTEGRITY_SECRET_QA:latest"
          SECRETS="${SECRETS},WOMPI_EVENTS_SECRET=WOMPI_EVENTS_SECRET_QA:latest"
          SECRETS="${SECRETS},WOMPI_WEBHOOK_URL=WOMPI_WEBHOOK_URL_QA:latest"
          SECRETS="${SECRETS},APP_URL=APP_URL_QA:latest"
          SECRETS="${SECRETS},ERROR_WEBHOOK_DISCOR=ERROR_WEBHOOK_DISCOR_QA:latest"
          SECRETS="${SECRETS},REDIS_URL=REDIS_URL_QA:latest"
          SECRETS="${SECRETS},PLATFORM_SUPER_ADMIN_CLERK_ID=PLATFORM_SUPER_ADMIN_CLERK_ID_QA:latest"
          SECRETS="${SECRETS},CORS_ORIGINS=CORS_ORIGINS_QA:latest"
          for r2_key in R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET R2_ENDPOINT; do
            if gcloud secrets describe "${r2_key}_QA" --project="${{ env.PROJECT_ID }}" >/dev/null 2>&1; then
              SECRETS="${SECRETS},${r2_key}=${r2_key}_QA:latest"
            fi
          done

          gcloud run deploy ${{ env.SERVICE }} \
            --image "${IMAGE}" \
            --region "${{ env.GCP_REGION }}" \
            --platform managed \
            --service-account "cloud-run-api@${{ env.PROJECT_ID }}.iam.gserviceaccount.com" \
            --allow-unauthenticated \
            --port 8080 \
            --set-env-vars="${ENV_VARS}" \
            --set-secrets="${SECRETS}" \
            --min-instances=1 \
            --max-instances=5

      # --- Verificación de revisión desplegada -------------------------
      - name: Smoke test
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE }} --region "${{ env.GCP_REGION }}" --format='value(status.url)')
          echo "🔗 Servicio: $URL"
          echo "📋 Commit: ${{ github.sha }}"
          echo "📦 Imagen: ${IMAGE}"
          echo "🧪 Probando /health..."
          curl -fsS "$URL/health" && echo ""
          echo "🧪 Probando /ready..."
          curl -fsS "$URL/ready" && echo ""

      - name: Reporte de despliegue
        run: |
          echo "============================================================"
          echo "  REPORTE DE DESPLIEGUE QA"
          echo "============================================================"
          echo "  Commit: ${{ github.sha }}"
          echo "  Imagen: ${IMAGE}"
          echo "  Servicio: ${{ env.SERVICE }}"
          echo "  Región: ${{ env.GCP_REGION }}"
          echo "  Proyecto: ${{ env.PROJECT_ID }}"
          echo "  Puerto: 8080"
          echo "  Autenticación: WIF (sin claves JSON)"
          echo "  Secret Manager: configurado (--set-secrets)"
          echo "============================================================"
