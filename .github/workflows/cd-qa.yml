name: CD - QA (Cloud Run)

on:
  push:
    branches: [QA]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_REGION: us-central1
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REPOSITORY: mr-training
  SERVICE: mr-training-api-qa
  IMAGE: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/mr-training/api:${{ github.sha }}

jobs:
  deploy:
    name: Deploy API to Cloud Run (QA)
    runs-on: ubuntu-latest
    environment: qa
    needs: [migrate]
    steps:
      - uses: actions/checkout@v4

      # --- WIF: autenticación sin claves JSON -------------------------
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER_QA }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT_QA }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          export_default_credentials: true

      - name: Verify Application Default Credentials
        run: gcloud auth application-default print-access-token > /dev/null && echo "✅ ADC configurado correctamente"

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev

      # --- Build y push de imagen inmutable (SHA del commit) ----------
      - name: Build and push API image
        working-directory: apps/api
        run: |
          docker build -t "${IMAGE}" .
          docker push "${IMAGE}"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"

      # --- Despliegue a Cloud Run QA -----------------------------------
      # Usamos --set-env-vars con GitHub Secrets (gratis, sin Secret Manager de GCP).
      # Máximo 0 secretos de Secret Manager = $0 gastos.
      - name: Deploy Cloud Run service
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --image "${IMAGE}" \
            --region "${{ env.GCP_REGION }}" \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --set-env-vars="APP_ENV=qa,APP_PORT=8080,LOG_LEVEL=info,CORS_ORIGINS=${{ secrets.CORS_ORIGINS_QA }},DATABASE_URL=${{ secrets.DATABASE_URL_QA }},CLERK_SECRET_KEY=${{ secrets.CLERK_SECRET_KEY_QA }},CLERK_PUBLISHABLE_KEY=${{ secrets.CLERK_PUBLISHABLE_KEY_QA }},CLERK_JWKS_URL=${{ secrets.CLERK_JWKS_URL_QA }},CLERK_WEBHOOK_SECRET=${{ secrets.CLERK_WEBHOOK_SECRET_QA }},WOMPI_PRIVATE_KEY=${{ secrets.WOMPI_PRIVATE_KEY_QA }},WOMPI_INTEGRITY_SECRET=${{ secrets.WOMPI_INTEGRITY_SECRET_QA }},WOMPI_EVENTS_SECRET=${{ secrets.WOMPI_EVENTS_SECRET_QA }},WOMPI_ENV=sandbox,WOMPI_WEBHOOK_URL=https://${{ env.SERVICE }}-${{ env.GCP_REGION }}.run.app/webhooks/wompi,APP_URL=https://${{ env.SERVICE }}-${{ env.GCP_REGION }}.run.app,WEB_APP_URL=https://${{ secrets.WEB_APP_URL_QA }}" \
            --min-instances=1 \
            --max-instances=5

      # --- Verificación de revisión desplegada -------------------------
      - name: Smoke test
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE }} --region "${{ env.GCP_REGION }}" --format='value(status.url)')
          echo "🔗 Servicio: $URL"
          echo "📋 Commit: ${{ github.sha }}"
          echo "📦 Imagen: ${IMAGE}"
          echo "🧪 Probando /health..."
          curl -fsS "$URL/health" && echo ""
          echo "🧪 Probando /ready..."
          curl -fsS "$URL/ready" && echo ""

      - name: Reporte de despliegue
        run: |
          echo "============================================================"
          echo "  REPORTE DE DESPLIEGUE QA"
          echo "============================================================"
          echo "  Commit: ${{ github.sha }}"
          echo "  Imagen: ${IMAGE}"
          echo "  Servicio: ${{ env.SERVICE }}"
          echo "  Región: ${{ env.GCP_REGION }}"
          echo "  Proyecto: ${{ env.PROJECT_ID }}"
          echo "  Puerto: 8080"
          echo "  Autenticación: WIF (sin claves JSON)"
          echo "  Secret Manager: 0 secretos (sin gastos)"
          echo "============================================================"
