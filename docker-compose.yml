services:
  pocketbase:
    image: ghcr.io/muchobien/pocketbase:latest
    container_name: mrtraining-pocketbase
    ports:
      - "8090:8090"
    volumes:
      - ./pb_data:/pb/pb_data
      - ./pb_hooks:/pb/pb_hooks
    command: serve --http=0.0.0.0:8090 --dir=/pb/pb_data
    restart: unless-stopped
