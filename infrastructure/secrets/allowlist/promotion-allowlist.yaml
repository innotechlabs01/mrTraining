# Allowlist de promoción de secretos DEV -> QA
# Un secreto solo puede promoverse si:
# 1. Está en esta lista (allowlist)
# 2. Ha sido aprobado explícitamente mediante GitHub Environment QA
# 3. No está en la lista de never_promote del entorno destino
#
# Este archivo NO contiene valores sensibles, solo nombres

promotion_rules:
  # Reglas generales
  require_ci_pass: true       # CI debe pasar antes de permitir promoción
  require_approval: true      # Requiere aprobación manual en GitHub Environment
  max_secrets_per_promotion: 20  # Límite de secretos por promoción
  dry_run_default: true       # Dry-run por defecto

# Secretos autorizados para promoción (nombres en DEV -> nombres en QA)
allowed_promotions:
  - source: CLERK_SECRET_KEY
    target: CLERK_SECRET_KEY_QA
    reason: "Clerk backend API key para QA"
    environment: qa

  - source: CLERK_PUBLISHABLE_KEY
    target: CLERK_PUBLISHABLE_KEY_QA
    reason: "Clerk publishable key para QA"
    environment: qa

  - source: CLERK_WEBHOOK_SECRET
    target: CLERK_WEBHOOK_SECRET_QA
    reason: "Clerk webhook signing secret para QA"
    environment: qa

  - source: WOMPI_PRIVATE_KEY
    target: WOMPI_PRIVATE_KEY_QA
    reason: "Wompi private key para pagos QA"
    environment: qa

  - source: WOMPI_EVENTS_SECRET
    target: WOMPI_EVENTS_SECRET_QA
    reason: "Wompi events secret para webhooks QA"
    environment: qa

  - source: WOMPI_INTEGRITY_SECRET
    target: WOMPI_INTEGRITY_SECRET_QA
    reason: "Wompi integrity secret para QA"
    environment: qa

  - source: APP_URL
    target: APP_URL_QA
    reason: "URL base de la aplicación QA"
    environment: qa

  - source: WOMPI_WEBHOOK_URL
    target: WOMPI_WEBHOOK_URL_QA
    reason: "URL de webhook de Wompi para QA"
    environment: qa

  - source: ERROR_WEBHOOK_DISCOR
    target: ERROR_WEBHOOK_DISCOR_QA
    reason: "Discord webhook para errores QA"
    environment: qa

  - source: CORS_ORIGINS
    target: CORS_ORIGINS_QA
    reason: "Orígenes CORS permitidos en QA"
    environment: qa

  - source: APP_ENV
    target: APP_ENV_QA
    reason: "Entorno de aplicación QA"
    environment: qa

  - source: APP_PORT
    target: APP_PORT_QA
    reason: "Puerto de la aplicación QA"
    environment: qa

  - source: LOG_LEVEL
    target: LOG_LEVEL_QA
    reason: "Nivel de logs QA"
    environment: qa

# Secretos que NUNCA deben promoverse (incluso si están en la allowlist)
blocked_promotions:
  - DATABASE_URL
  - REDIS_URL
  - NATS_URL
  - DATABASE_URL_QA
  - REDIS_URL_QA
  - NATS_URL_QA

# Reglas de validación previa a la promoción
validation_rules:
  - name: "secret_exists_in_source"
    description: "El secreto debe existir en el entorno origen"
    required: true

  - name: "secret_not_in_blocked_list"
    description: "El secreto no debe estar en la lista de bloqueo"
    required: true

  - name: "target_not_production"
    description: "El destino no puede ser production (promoción manual solo)"
    required: true

  - name: "ci_passed"
    description: "CI debe haber pasado para el commit de origen"
    required: true