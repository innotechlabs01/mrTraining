# Configuración de entorno - Production
# Fuente de verdad: Infisical Production
# Destino de secretos: Google Secret Manager (para Cloud Run Production)
# ESTE ENTORNO PERMANECE AISLADO - NO SE COPIAN VALORES AUTOMÁTICAMENTE
# Este archivo NO contiene valores sensibles

environment:
  name: production
  display_name: "Producción"
  region: us-central1
  source: infisical
  infisical_environment: production

infisical:
  base_url: "https://app.infisical.com"
  environment: production
  secret_path: "/"
  cache_ttl: "5m"

google_secret_manager:
  enabled: true
  project_id: "mr-training-backend"
  region: "us-central1"

required_secrets:
  - DATABASE_URL_PROD
  - CLERK_SECRET_KEY_PROD
  - CLERK_PUBLISHABLE_KEY_PROD
  - CLERK_WEBHOOK_SECRET_PROD
  - WOMPI_PRIVATE_KEY_PROD
  - WOMPI_EVENTS_SECRET_PROD
  - WOMPI_INTEGRITY_SECRET_PROD

optional_secrets:
  - APP_URL_PROD
  - WOMPI_WEBHOOK_URL_PROD
  - ERROR_WEBHOOK_DISCOR_PROD
  - CORS_ORIGINS_PROD
  - APP_ENV_PROD
  - APP_PORT_PROD
  - LOG_LEVEL_PROD

# Production NO permite promoción automática desde QA
promotion_allowlist: []

secret_name_mapping:
  CLERK_SECRET_KEY: CLERK_SECRET_KEY_PROD
  CLERK_PUBLISHABLE_KEY: CLERK_PUBLISHABLE_KEY_PROD
  CLERK_WEBHOOK_SECRET: CLERK_WEBHOOK_SECRET_PROD
  WOMPI_PRIVATE_KEY: WOMPI_PRIVATE_KEY_PROD
  WOMPI_EVENTS_SECRET: WOMPI_EVENTS_SECRET_PROD
  WOMPI_INTEGRITY_SECRET: WOMPI_INTEGRITY_SECRET_PROD
  APP_URL: APP_URL_PROD
  WOMPI_WEBHOOK_URL: WOMPI_WEBHOOK_URL_PROD
  ERROR_WEBHOOK_DISCOR: ERROR_WEBHOOK_DISCOR_PROD
  CORS_ORIGINS: CORS_ORIGINS_PROD
  APP_ENV: APP_ENV_PROD
  APP_PORT: APP_PORT_PROD
  LOG_LEVEL: LOG_LEVEL_PROD

version_retention:
  keep_latest: 3                    # Mantener las 3 últimas versiones en producción
  max_versions_per_secret: 20       # Límite mayor en producción
  destroy_unreferenced_after_days: 90  # Más tiempo en producción
  dry_run_default: true             # Dry-run obligatorio en producción