# Configuración de entorno - QA (Quality Assurance)
# Fuente de verdad: Infisical QA
# Destino de secretos: Google Secret Manager (para Cloud Run QA)
# Este archivo NO contiene valores sensibles

environment:
  name: qa
  display_name: "Quality Assurance"
  region: us-central1
  source: infisical
  infisical_environment: qa

infisical:
  base_url: "http://localhost:80"
  environment: qa
  secret_path: "/"
  cache_ttl: "5m"

google_secret_manager:
  enabled: true
  project_id: "mr-training-backend"
  region: "us-central1"

required_secrets:
  - DATABASE_URL_QA
  - CLERK_SECRET_KEY_QA
  - CLERK_PUBLISHABLE_KEY_QA
  - CLERK_WEBHOOK_SECRET_QA
  - WOMPI_PRIVATE_KEY_QA
  - WOMPI_EVENTS_SECRET_QA
  - WOMPI_INTEGRITY_SECRET_QA

optional_secrets:
  - APP_URL_QA
  - WOMPI_WEBHOOK_URL_QA
  - ERROR_WEBHOOK_DISCOR_QA
  - CORS_ORIGINS_QA
  - APP_ENV_QA
  - APP_PORT_QA
  - LOG_LEVEL_QA

# Secretos autorizados para promoción desde DEV a QA
# Un secreto solo puede promoverse si está en esta lista
promotion_allowlist:
  - CLERK_SECRET_KEY
  - CLERK_PUBLISHABLE_KEY
  - CLERK_WEBHOOK_SECRET
  - WOMPI_PRIVATE_KEY
  - WOMPI_EVENTS_SECRET
  - WOMPI_INTEGRITY_SECRET
  - APP_URL
  - WOMPI_WEBHOOK_URL
  - ERROR_WEBHOOK_DISCOR
  - CORS_ORIGINS
  - APP_ENV
  - APP_PORT
  - LOG_LEVEL

# Mapeo de nombres: nombre en DEV -> nombre en QA
secret_name_mapping:
  CLERK_SECRET_KEY: CLERK_SECRET_KEY_QA
  CLERK_PUBLISHABLE_KEY: CLERK_PUBLISHABLE_KEY_QA
  CLERK_WEBHOOK_SECRET: CLERK_WEBHOOK_SECRET_QA
  WOMPI_PRIVATE_KEY: WOMPI_PRIVATE_KEY_QA
  WOMPI_EVENTS_SECRET: WOMPI_EVENTS_SECRET_QA
  WOMPI_INTEGRITY_SECRET: WOMPI_INTEGRITY_SECRET_QA
  APP_URL: APP_URL_QA
  WOMPI_WEBHOOK_URL: WOMPI_WEBHOOK_URL_QA
  ERROR_WEBHOOK_DISCOR: ERROR_WEBHOOK_DISCOR_QA
  CORS_ORIGINS: CORS_ORIGINS_QA
  APP_ENV: APP_ENV_QA
  APP_PORT: APP_PORT_QA
  LOG_LEVEL: LOG_LEVEL_QA

# Política de versiones para Secret Manager QA
# POLÍTICA ESTRICTA: exactamente 2 versiones recuperables por secreto
# - Versión más reciente: ENABLED (en uso por Cloud Run)
# - Versión inmediatamente anterior: ENABLED (reservada para rollback)
# - Todas las demás: DESTROYED (no DISABLED, para dejar de generar costo)
version_retention:
  keep_latest: 2                    # EXACTAMENTE 2 versiones recuperables (no configurable)
  max_versions_per_secret: 2        # Límite estricto: no más de 2 versiones ENABLED
  destroy_unreferenced_after_days: 0  # Destruir inmediatamente versiones sobrantes (sin período de gracia)
  dry_run_default: true             # Dry-run por defecto en limpieza
  destroy_state: DESTROYED          # Las versiones sobrantes van a DESTROYED, no DISABLED