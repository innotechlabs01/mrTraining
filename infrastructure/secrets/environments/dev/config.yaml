# Configuración de entorno - Desarrollo Local (DEV)
# Fuente de verdad: Infisical DEV
# Este archivo NO contiene valores sensibles, solo nombres y metadatos

environment:
  name: dev
  display_name: "Desarrollo Local"
  region: local
  source: infisical
  infisical_environment: dev

infisical:
  base_url: "http://localhost:80"
  environment: dev
  secret_path: "/"
  cache_ttl: "5m"
  project_id: "7218cfde-d9ad-4722-8ffa-9009b1cc40a8"

google_secret_manager:
  enabled: false
  project_id: ""
  region: ""

required_secrets:
  - DATABASE_URL
  - REDIS_URL
  - NATS_URL
  - CLERK_SECRET_KEY
  - CLERK_WEBHOOK_SECRET
  - WOMPI_PRIVATE_KEY
  - WOMPI_EVENTS_SECRET
  - WOMPI_INTEGRITY_SECRET

optional_secrets:
  - FIREBASE_PROJECT_ID
  - FIREBASE_CLIENT_EMAIL
  - FIREBASE_PRIVATE_KEY
  - EMAIL_SMTP_HOST
  - EMAIL_SMTP_PORT
  - EMAIL_SMTP_USERNAME
  - EMAIL_SMTP_PASSWORD
  - ERROR_WEBHOOK_DISCOR
  - MERCADO_PAGO_WEBHOOK_URL
  - MERCADO_PAGO_SECRET_KEY
  - MERCADO_PAGO_PUBLIC_KEY
  - MERCADO_PAGO_WEBHOOK_SECRET

# Variables que NO deben promoverse a QA automáticamente
never_promote:
  - DATABASE_URL   # Cada ambiente tiene su propia DB
  - REDIS_URL      # Cada ambiente tiene su propio Redis
  - NATS_URL       # Cada ambiente tiene su propio NATS