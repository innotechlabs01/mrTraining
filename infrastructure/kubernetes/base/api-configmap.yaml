apiVersion: v1
kind: ConfigMap
metadata:
  name: mr-training-api-config
  namespace: mr-training
  labels:
    app: mr-training-api
data:
  APP_ENV: "development"
  APP_NAME: "mr-training-api"
  LOG_LEVEL: "debug"
  APP_PORT: "9090"
  DATABASE_URL: "postgresql://mr_training_app:MrTrainingApp_LocalOnly_!2026@postgres.mr-training.svc.cluster.local:5432/mr_training?sslmode=disable"
  REDIS_URL: "redis:6379"
  NATS_URL: "nats://nats:4222"
  CORS_ORIGINS: "http://localhost:3000,http://localhost:8081,exp://localhost:8081"
  RATE_LIMIT_MAX: "100"
  RATE_LIMIT_WINDOW: "60"
  WOMPI_ENV: "sandbox"
  WOMPI_WEBHOOK_URL: "http://localhost:9090/webhooks/wompi"
  APP_URL: "http://localhost:9090"
  WEB_APP_URL: "http://localhost:3000"
  EMAIL_ENABLED: "false"
  INFISICAL_ENABLED: "false"
  INFISICAL_BASE_URL: "http://infisical:8080"
  INFISICAL_ENVIRONMENT: "dev"
  INFISICAL_SECRET_PATH: "/"
  INFISICAL_CACHE_TTL: "5m"
