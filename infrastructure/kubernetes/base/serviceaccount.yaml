apiVersion: v1
kind: ServiceAccount
metadata:
  name: mr-training-api
  namespace: mr-training
  labels:
    app: mr-training-api
    component: serviceaccount
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mr-training-api
  namespace: mr-training
rules:
  # Allow reading configmaps and secrets in the same namespace
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
  # Allow reading own pod info
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mr-training-api
  namespace: mr-training
subjects:
  - kind: ServiceAccount
    name: mr-training-api
    namespace: mr-training
roleRef:
  kind: Role
  name: mr-training-api
  apiGroup: rbac.authorization.k8s.io