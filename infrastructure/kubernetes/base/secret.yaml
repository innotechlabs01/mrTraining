apiVersion: v1
kind: Secret
metadata:
  name: mr-training-api-secrets
  namespace: mr-training
  labels:
    app: mr-training-api
    component: secrets
type: Opaque
# NOTE: These values are PLACEHOLDERS for local development.
# In production, use External Secrets Operator or sealed secrets.
# For local k3d, you can apply this with real values, or use:
# kubectl create secret generic mr-training-api-secrets \
#   --from-literal=DATABASE_URL="postgresql://..." \
#   --from-literal=REDIS_URL="redis://..." \
#   --namespace=mr-training \
#   --dry-run=client -o yaml | kubectl apply -f -
stringData:
  # Database - UPDATE with your actual DATABASE_URL before applying to k3d
  # Format: postgresql://user:pass@host:5432/dbname?sslmode=disable
  DATABASE_URL: ""

  # Redis - UPDATE with your actual REDIS_URL before applying to k3d
  REDIS_URL: ""

  # NATS (optional)
  NATS_URL: ""

  # Clerk Auth - UPDATE with your actual keys before applying to k3d
  CLERK_SECRET_KEY: ""
  CLERK_WEBHOOK_SECRET: ""

  # Wompi - UPDATE with your actual keys before applying to k3d
  WOMPI_PRIVATE_KEY: ""
  WOMPI_EVENTS_SECRET: ""
  WOMPI_INTEGRITY_SECRET: ""

  # Infisical - UPDATE with your actual values before applying to k3d
  INFISICAL_CLIENT_ID: ""
  INFISICAL_CLIENT_SECRET: ""
  INFISICAL_PROJECT_ID: ""