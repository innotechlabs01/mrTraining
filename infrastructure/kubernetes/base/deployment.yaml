apiVersion: apps/v1
kind: Deployment
metadata:
  name: mr-training-api
  namespace: mr-training
  labels:
    app: mr-training-api
    component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mr-training-api
  template:
    metadata:
      labels:
        app: mr-training-api
        component: api
    spec:
      serviceAccountName: mr-training-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: mr-training-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9090
              protocol: TCP
          envFrom:
            - configMapRef:
                name: mr-training-api-config
            - secretRef:
                name: mr-training-api-secrets
          env:
            # Override specific values if needed
            - name: APP_PORT
              value: "9090"
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 9090
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
      # Use host network for accessing host.docker.internal services
      # For local development with existing PostgreSQL/Redis/NATS on host
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      restartPolicy: Always
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0