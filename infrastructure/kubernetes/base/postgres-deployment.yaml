apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: mr-training
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: mr_training
            - name: POSTGRES_USER
              value: mr_training_app
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mr-training-secrets
                  key: postgres-password
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              memory: 256Mi
              cpu: 250m
            limits:
              memory: 512Mi
              cpu: 500m
      volumes:
        - name: postgres-data
          emptyDir: {}
      restartPolicy: Always
