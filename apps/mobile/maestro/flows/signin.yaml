appId: com.innotechlabssas.mrtraining
---
- launchApp
- waitForAnimationToEnd
- tapOn:
    id: "sign-in-button"
- waitForAnimationToEnd
- inputText:
    id: "email-input"
    text: "${MAESTRO_ATHLETE_EMAIL}"
- inputText:
    id: "password-input"
    text: "${MAESTRO_ATHLETE_PASSWORD}"
- tapOn:
    id: "submit-button"
- waitForAnimationToEnd
