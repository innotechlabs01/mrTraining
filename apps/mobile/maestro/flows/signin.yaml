appId: com.innotechlabssas.mrtraining.dev
---
- launchApp
- waitForAnimationToEnd
- tapOn:
    label: "Omitir onboarding"
- waitForAnimationToEnd
- tapOn:
    label: "Ya entreno — Iniciar sesión para continuar"
- waitForAnimationToEnd
- inputText:
    element:
      label: "Correo electrónico"
    text: "${MAESTRO_ATHLETE_EMAIL}"
- inputText:
    element:
      label: "Contraseña"
    text: "${MAESTRO_ATHLETE_PASSWORD}"
- tapOn:
    label: "Iniciar sesión"
- waitForAnimationToEnd
